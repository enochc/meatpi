[package]
name = "meatpi-app"
description = "Slint dashboard for a MeatPi WiCAN Pro"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib is what the Android NativeActivity loads; rlib keeps the desktop
# binary able to link the same code.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "meatpi-app"
path = "src/main.rs"

[dependencies]
meatpi-core.workspace = true
log = "0.4"
slint = "1.17.1"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17.1", features = ["backend-android-activity-06"] }
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[build-dependencies]
slint-build = "1.17.1"

# Consumed by `cargo apk`. See docs/ANDROID.md.
[package.metadata.android]
package = "com.enochcarter.meatpi"
build_targets = ["aarch64-linux-android"]
# The dongle serves plain TCP, so the app must be allowed to open a cleartext
# socket to it.
[package.metadata.android.application]
label = "MeatPi"
uses_cleartext_traffic = true

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"
