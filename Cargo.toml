[workspace]
resolver = "2"
members = ["crates/meatpi-core", "crates/meatpi-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrenoch/meatpi"

[workspace.dependencies]
meatpi-core = { path = "crates/meatpi-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
